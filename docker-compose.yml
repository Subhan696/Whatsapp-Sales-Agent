version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wauser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wapass}
      POSTGRES_DB: ${POSTGRES_DB:-wa_agent}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wauser} -d ${POSTGRES_DB:-wa_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - WA_BRIDGE_URL=http://bridge:3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/static/uploads
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/app/static:ro                        # serve uploaded files directly
      - certbot_www:/var/www/certbot:ro               # ACME challenge files
      - certbot_certs:/etc/letsencrypt:ro             # SSL certificates
    depends_on:
      - app
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Run manually: docker compose run --rm certbot certonly --webroot ...
    # Renewal:      docker compose run --rm certbot renew
    entrypoint: /bin/sh -c "trap exit TERM; while :; do sleep 12h; certbot renew; done"
    restart: unless-stopped

  bridge:
    build: ./wa-bridge
    ports:
      - "3000:3000"
    env_file:
      - ./wa-bridge/.env
    environment:
      - PYTHON_INBOUND_URL=http://app:8000/wa-bridge/inbound
    depends_on:
      - app
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped
    profiles:
      - dev

volumes:
  pgdata:
  uploads:
  certbot_www:
  certbot_certs:
