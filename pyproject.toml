[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wa-sales-agent"
version = "0.1.0"
description = "WhatsApp Business AI Sales Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=1.0.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "anthropic>=0.28.0",
    "openai>=1.30.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "alembic>=1.13.0",
    "structlog>=24.2.0",
    "prometheus-client>=0.20.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.4.0",
    "black>=24.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
